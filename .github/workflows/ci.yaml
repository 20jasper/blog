name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    env:
      CI: true
      ASTRO_TELEMETRY_DISABLED: true

    name: ci
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        id: pnpm-install
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: pnpm
      - name: Install dependencies
        run: pnpm i
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Build project
        env:
          GOOGLE_ANALYTICS_ID: 12345
        run: pnpm run build

  visual-regression:
    name: visual regression (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image and compare screenshots against committed baselines
        run: docker compose run --rm visual-tests
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
